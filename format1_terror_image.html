<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Format 1: Terror Image</title>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap" rel="stylesheet">
<style>
    body {
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: 'Clash Display', sans-serif;
    }
    .post-image {
        width: 1080px;
        height: 1080px;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 100px;
        box-sizing: border-box;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        transform: scale(0.6); /* Scale down for preview */
    }
    .terror-text {
        font-size: 110px;
        font-weight: 700;
        color: #111111;
        line-height: 1.1;
        letter-spacing: -2px;
    }
    .highlight {
        color: #e53e3e; /* Devastating red */
    }
</style>
</head>
<body>
    <div class="post-image">
        <div class="terror-text">
            One panicked leasing manager just cost you <br><span class="highlight">$750,000.</span>
        </div>
    </div>
</body>
</html>
