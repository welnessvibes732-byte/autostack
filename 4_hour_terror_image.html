<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terror Image Graphic</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
        }

        .graphic-container {
            width: 1080px;
            height: 1080px;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000000 80%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Subtle noise overlay for texture */
        .noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
            pointer-events: none;
        }

        .terror-text {
            font-size: 84px;
            font-weight: 800;
            line-height: 1.1;
            text-align: center;
            letter-spacing: -0.03em;
            max-width: 800px;
            z-index: 2;
            color: #ffffff;
        }

        .highlight-red {
            color: #ff3333; /* A stark, urgent red */
        }

        .subtext {
            margin-top: 60px;
            font-size: 32px;
            font-weight: 400;
            color: #888888;
            letter-spacing: -0.01em;
            z-index: 2;
        }

        .logo {
            position: absolute;
            bottom: 60px;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.1em;
            color: #555555;
            text-transform: uppercase;
            z-index: 2;
        }
    </style>
</head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <button id="downloadBtn" style="position: absolute; top: 20px; right: 20px; padding: 12px 24px; background: #ff3333; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; z-index: 100; font-family: 'Inter', sans-serif;">Download Image (PNG)</button>
    
    <div class="graphic-container" id="captureTarget">
        <div class="noise"></div>
        <div class="terror-text">
            You have exactly <br>
            <span class="highlight-red">4 hours</span> <br>
            to save a $30,000 lease.
        </div>
        <div class="subtext">
            Are you missing the window?
        </div>
        <div class="logo">A E T H E R A</div>
    </div>

    <script>
        document.getElementById('downloadBtn').addEventListener('click', function() {
            // Hide the button so it doesn't appear in the screenshot
            this.style.display = 'none';
            
            html2canvas(document.getElementById('captureTarget'), {
                scale: 2, // 2x resolution for crispness
                backgroundColor: '#000000'
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = '4_hour_window_terror.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                // Show the button again
                this.style.display = 'block';
            });
        });
    </script>
</body>
</html>
